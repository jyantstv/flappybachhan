  let deathAudio = null;
  function playDeathSound() {
    if (!soundOn) return;
    try {
      deathAudio ||= new Audio(deathSoundData);

      const playback = deathAudio.play();
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    } catch (_) {}
  }

  function flap() {
    if (state === 'over' && performance.now() < inputLockedUntil) return;
    if (state === 'over') {
      resetGame(); state = 'playing'; bird.vy = -475;
      playJumpSound();
      burst(bird.x, bird.y, '#fff3a9', 7);
      return;
    }
    if (state === 'ready') state = 'playing';
    if (state === 'playing') {

  }

  function onPointer(e) {
    e.preventDefault();
    if (e.button !== undefined && e.button !== 0) return;
    if (state === 'over' && performance.now() < inputLockedUntil) return;
    const x = e.clientX * unitScale;
    const y = e.clientY * unitScale;

    if (soundHit && state !== 'playing') { toggleSound(); return; }

  }

  function birdHitsPipe(p) {
    // Collision box follows the visible circular portrait and pipe lips.
    const halfW = CHARACTER_SIZE * 0.52;
    const halfH = CHARACTER_SIZE * 0.48;
    const left = bird.x - halfW;
    const right = bird.x + halfW;
    const top = bird.y - halfH;
    const bottom = bird.y + halfH;
    const pipeLeft = p.x - PIPE_LIP;
    const pipeRight = p.x + p.w + PIPE_LIP;
    if (right <= pipeLeft || left >= pipeRight) return false;
    return top < p.top || bottom > p.top + p.gap;
  }

  function die() {
    if (state !== 'playing') return;
    state = 'over';
    inputLockedUntil = performance.now() + DEATH_INPUT_LOCK_MS;
    bird.vy = -170;
    playDeathSound();
    burst(bird.x, bird.y, '#ffb45e', 18);
  }

  function update(dt) {
    elapsed += dt;
    worldScroll += (state === 'playing' ? 164 : 26) * dt;
    bird.wing += dt * (state === 'playing' ? 19 : 8);
    bird.blink = Math.max(0, bird.blink - dt);
    bird.squish = Math.max(0, bird.squish - dt);
    if (Math.random() < dt * 0.12) bird.blink = 0.12;

    if (state === 'playing') {
      bird.vy = Math.min(760, bird.vy + 1420 * dt);
      bird.y += bird.vy * dt;
      bird.rot = clamp(bird.vy / 620, -0.45, 1.2);

      for (const p of pipes) {
        p.x -= 164 * dt;
        if (!p.scored && p.x + p.w < bird.x) {
          p.scored = true; score++;
          burst(bird.x, bird.y, '#ffe77c', 8);
          if (score > best) {
            best = score;
            try { localStorage.setItem('skyHopperBest', String(best)); } catch (_) {}
          }
        }
        if (birdHitsPipe(p)) { die(); break; }
      }

      while (pipes.length && pipes[0].x + pipes[0].w + PIPE_LIP < -24) pipes.shift();

      if (bird.y - CHARACTER_SIZE * 0.48 < 0 || bird.y + CHARACTER_SIZE * 0.48 > GROUND) die();
    } else if (state === 'ready') {
      bird.y = 330 + Math.sin(elapsed * 2.7) * 10;
      bird.rot = Math.sin(elapsed * 2.7) * 0.035;
    } else if (state === 'over') {
      bird.vy += 1500 * dt;
      bird.y = Math.min(GROUND - CHARACTER_SIZE * 0.48, bird.y + bird.vy * dt);
      bird.rot = Math.min(1.45, bird.rot + dt * 2.6);

    for (let i = particles.length - 1; i >= 0; i--) {

      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;

    const birdCount = Math.ceil(worldW / 145) + 1;
    for (let i = 0; i < birdCount; i++) {
      const x = mod(i * 145 + worldScroll * 0.34 + 18, worldW + 50) - 20;
      const y = 294 + (i % 4) * 18;
      ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.quadraticCurveTo(x - 2, y - 6, x + 2, y);
      ctx.quadraticCurveTo(x + 7, y - 6, x + 12, y); ctx.stroke();
    }
  }

  function drawPipe(p) {
    const x = p.x, w = p.w, topY = p.top, bottomY = p.top + p.gap;
    const bottomH = Math.max(0, GROUND - bottomY);
    const lipX = x - PIPE_LIP, lipW = w + PIPE_LIP * 2, lipH = 25;

    // Main columns use square inner edges; caps are drawn separately so the gap
    // stays clean, symmetrical, and exactly aligned with collision geometry.
    ctx.fillStyle = 'rgba(25,90,80,.12)';
    ctx.fillRect(x + 5, 0, w, topY);
    ctx.fillRect(x + 5, bottomY, w, bottomH);

    const body = ctx.createLinearGradient(x, 0, x + w, 0);
    body.addColorStop(0, '#15996b'); body.addColorStop(0.22, '#4bd28c');
    body.addColorStop(0.70, '#21b778'); body.addColorStop(1, '#0e8d64');
    ctx.fillStyle = body;
    ctx.fillRect(x, 0, w, topY);
    ctx.fillRect(x, bottomY, w, bottomH);

    const lip = ctx.createLinearGradient(lipX, 0, lipX + lipW, 0);
    lip.addColorStop(0, '#0e9b68'); lip.addColorStop(0.2, '#6ce1a0');
    lip.addColorStop(0.7, '#31c986'); lip.addColorStop(1, '#0b865d');
    ctx.fillStyle = lip;
    roundedRect(lipX, topY - lipH, lipW, lipH, 6); ctx.fill();
    roundedRect(lipX, bottomY, lipW, lipH, 6); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.20)';
    ctx.fillRect(x + 12, 0, 5, Math.max(0, topY - lipH));
    ctx.fillRect(x + 12, bottomY + lipH, 5, Math.max(0, bottomH - lipH));
    ctx.fillStyle = 'rgba(0,72,54,.15)';
    ctx.fillRect(x + w - 10, 0, 5, Math.max(0, topY - lipH));
    ctx.fillRect(x + w - 10, bottomY + lipH, 5, Math.max(0, bottomH - lipH));

    ctx.strokeStyle = 'rgba(5,113,79,.38)'; ctx.lineWidth = 2;
    roundedRect(lipX + 0.5, topY - lipH + 0.5, lipW - 1, lipH - 1, 6); ctx.stroke();
    roundedRect(lipX + 0.5, bottomY + 0.5, lipW - 1, lipH - 1, 6); ctx.stroke();
  }

  function drawGround() {
    ctx.fillStyle = '#dcae61'; ctx.fillRect(0, GROUND, worldW, H - GROUND);
    ctx.fillStyle = '#fff0b5'; ctx.fillRect(0, GROUND, worldW, 8);
    ctx.fillStyle = '#78d18b'; ctx.fillRect(0, GROUND + 8, worldW, 12);
    ctx.fillStyle = '#52b873'; ctx.fillRect(0, GROUND + 20, worldW, 5);
    ctx.save(); ctx.beginPath(); ctx.rect(0, GROUND + 24, worldW, H - GROUND - 24); ctx.clip();
    const offset = -mod(worldScroll, 38);
    for (let x = offset - 38; x < worldW + 38; x += 38) {
      ctx.fillStyle = '#c9944e'; ctx.beginPath(); ctx.moveTo(x, GROUND + 38);
      ctx.lineTo(x + 18, GROUND + 32); ctx.lineTo(x + 30, GROUND + 40);
      ctx.lineTo(x + 10, GROUND + 48); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#edc477'; ctx.fillRect(x + 5, GROUND + 62, 4, 3);
    }
    ctx.restore();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    // The sprite faces right: rotate around its center so it pitches up on a flap
    // and nose-down during a fall, without flipping upside-down during normal play.
    const maxTilt = state === 'over' ? 1.42 : 0.92;
    ctx.rotate(clamp(bird.rot, -0.62, maxTilt));

    const squash = bird.squish > 0 ? 1 - bird.squish * 0.8 : 1;
    const sizeY = CHARACTER_SIZE * squash;
    const sizeX = sizeY * (250 / 190) * (1 + (1 - squash) * 0.12);
    const frameIndex = Math.floor(((bird.wing % TAU + TAU) % TAU) / TAU * 4) % 4;

    if (characterSprite.complete && characterSprite.naturalWidth >= 1000 && characterSprite.naturalHeight >= 190) {
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.shadowColor = 'rgba(16, 47, 69, 0.20)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;
      // Source rectangle selects the current pose; all frames share an identical pivot.
      ctx.drawImage(
        characterSprite,
        frameIndex * 250, 0, 250, 190,
        -sizeX / 2, -sizeY / 2, sizeX, sizeY
      );
    } else {
      // Fallback for the brief moment before the embedded sprite decodes.
      const fallback = ctx.createLinearGradient(-18, -18, 20, 20);
      fallback.addColorStop(0, '#ffe47a'); fallback.addColorStop(1, '#f5a333');
      ctx.fillStyle = fallback;
      ctx.beginPath(); ctx.arc(0, 0, CHARACTER_SIZE * 0.43, 0, TAU); ctx.fill();
      ctx.fillStyle = '#263f55'; ctx.beginPath(); ctx.arc(7, -5, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawText(str, x, y, size, color, weight = 800, align = 'center') {
    ctx.font = `${weight} ${size}px ui-rounded, "Trebuchet MS", system-ui, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size * 0.09); ctx.strokeStyle = 'rgba(20,72,92,.15)';
    ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
  }

  function drawBadge(x, y, w, h, fill = 'rgba(255,255,255,.86)') {
    ctx.save(); ctx.shadowColor = 'rgba(31,88,108,.16)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 5;
    ctx.fillStyle = fill; roundedRect(x, y, w, h, 18); ctx.fill(); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 1.5;
    roundedRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 17); ctx.stroke();
  }

  function drawSoundButton() {
    drawBadge(worldW - 62, 20, 44, 44, 'rgba(255,255,255,.78)');
    ctx.strokeStyle = '#356b7b'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(worldW - 49, 36); ctx.lineTo(worldW - 44, 36);
    ctx.lineTo(worldW - 37, 30); ctx.lineTo(worldW - 37, 54); ctx.lineTo(worldW - 44, 48);
    ctx.lineTo(worldW - 49, 48); ctx.closePath(); ctx.stroke();
    if (soundOn) {
      ctx.beginPath(); ctx.arc(worldW - 38, 42, 7, -0.85, 0.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(worldW - 38, 42, 12, -0.72, 0.72); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(worldW - 31, 34); ctx.lineTo(worldW - 23, 50);
      ctx.moveTo(worldW - 23, 34); ctx.lineTo(worldW - 31, 50); ctx.stroke();
    }
  }

  function drawUI() {
    drawText('SKY HOPPER', worldW / 2, 52, 17, '#ffffff', 900);
    if (state === 'playing') {
      drawBadge(worldW / 2 - 36, 76, 72, 53, 'rgba(255,255,255,.9)');
      drawText(String(score), worldW / 2, 102, 29, '#22536b', 900);
    } else {
      drawBadge(18, 20, 112, 50, 'rgba(255,255,255,.78)');
      drawText('BEST', 42, 36, 9, '#66818b', 900, 'left');
      drawText(String(best), 42, 54, 18, '#24546a', 900, 'left');
      drawSoundButton();
    }

    if (state === 'ready') {
      const cardW = Math.min(338, worldW - 32);
      drawBadge((worldW - cardW) / 2, 410, cardW, 155, 'rgba(255,255,255,.88)');
      drawText('READY TO FLY?', worldW / 2, 447, cardW < 280 ? 21 : 24, '#24576b', 900);
      drawText('Tap to flap through the gaps', worldW / 2, 484, cardW < 280 ? 11 : 13, '#557b85', 700);
      const pulse = 1 + Math.sin(elapsed * 4) * 0.06;
      ctx.save(); ctx.translate(worldW / 2, 523); ctx.scale(pulse, pulse);
      ctx.fillStyle = '#ffbd49'; ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff4c5'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.moveTo(-4, -2); ctx.lineTo(0, -6); ctx.lineTo(4, -2); ctx.stroke(); ctx.restore();
    } else if (state === 'over') {
      const cardW = Math.min(342, worldW - 32);
      drawBadge((worldW - cardW) / 2, 355, cardW, 220, 'rgba(255,255,255,.92)');
      ctx.fillStyle = '#ffe4a0'; ctx.beginPath(); ctx.arc(worldW / 2, 388, 26, 0, TAU); ctx.fill();
      drawText('✦', worldW / 2, 389, 25, '#ed9942', 900);
      drawText('NICE TRY!', worldW / 2, 432, 25, '#24576b', 900);
      drawText('SCORE', worldW / 2 - 54, 476, 11, '#6d8990', 800);
      drawText(String(score), worldW / 2 - 54, 507, 27, '#24576b', 900);
      ctx.fillStyle = '#d5e7df'; ctx.fillRect(worldW / 2, 461, 1.5, 61);
      drawText('BEST', worldW / 2 + 54, 476, 11, '#6d8990', 800);
      drawText(String(best), worldW / 2 + 54, 507, 27, '#24576b', 900);
      const pulse = 1 + Math.sin(elapsed * 4) * 0.018;
      ctx.save(); ctx.translate(worldW / 2, 548); ctx.scale(pulse, pulse);
      ctx.shadowColor = 'rgba(21,108,87,.2)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
      ctx.fillStyle = '#27b77e'; roundedRect(-78, -22, 156, 44, 22); ctx.fill(); ctx.restore();
      const waitMs = Math.max(0, inputLockedUntil - performance.now());
      const retryLabel = waitMs > 0 ? `WAIT ${(waitMs / 1000).toFixed(1)}s` : 'PLAY AGAIN';
      drawText(retryLabel, worldW / 2, 548, 14, '#ffffff', 900);
    }
  }

  function render() {
    // Canvas backing pixels are DPR-scaled, while all game coordinates remain
    // logical units. This avoids blurry graphics and keeps the scene in bounds.
    // World coordinates are 768 units tall; invert H/viewH so the world fills
    // the CSS viewport exactly. Multiplying by DPR renders at phone pixel density.
    ctx.setTransform(dpr / unitScale, 0, 0, dpr / unitScale, 0, 0);
    ctx.fillStyle = '#61c8f0'; ctx.fillRect(0, 0, worldW, H);
    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * Math.max(0.2, p.life / p.max), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawBird(); drawUI();
  }

  function frame(now) {
    if (!lastTime) lastTime = now;
    let delta = (now - lastTime) / 1000;
    lastTime = now;
    // Fixed 120 Hz simulation with requestAnimationFrame rendering.
    accumulator += clamp(delta, 0, 0.1);
    let steps = 0;
    while (accumulator >= FIXED_STEP && steps < 12) {
      update(FIXED_STEP);
      accumulator -= FIXED_STEP;
      steps++;
    }
    if (steps >= 12) accumulator = 0; // discard excessive time after a stalled tab
    render();
    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', () => {
    // Discard stale frame time when returning from another app or a background tab.
    lastTime = 0;
    accumulator = 0;
  });

  resize();
  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
